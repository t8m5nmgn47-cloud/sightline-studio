name: BI quality

on:
  push:
    branches: [main, feature/bi-learning-memory-v9]
    paths:
      - 'api/_intelligence.js'
      - 'api/_bi_patterns.js'
      - 'api/_bi_feed.js'
      - 'api/_peer_quality.js'
      - 'api/_discover.js'
      - 'api/_check_observations.js'
      - 'api/_change_intelligence.js'
      - 'api/_readiness_intelligence.js'
      - 'api/_portfolio_intelligence.js'
      - 'api/_insight_refresh.js'
      - 'api/_operator_digest.js'
      - 'api/_learning_memory.js'
      - 'api/_lib.js'
      - 'api/audit-refresh.js'
      - 'api/intelligence-refresh.js'
      - 'api/intelligence-learning.js'
      - 'api/bi-events.js'
      - 'api/contact.js'
      - 'api/scan-live.js'
      - 'api/recommendations.js'
      - 'api/weekly-brief.js'
      - 'api/intelligence-portfolio.js'
      - 'intelligence/**'
      - 'middleware.js'
      - 'vercel.json'
      - 'bi/**'
      - 'package.json'
      - '.github/workflows/bi-quality.yml'
  pull_request:
    paths:
      - 'api/_intelligence.js'
      - 'api/_bi_patterns.js'
      - 'api/_bi_feed.js'
      - 'api/_peer_quality.js'
      - 'api/_discover.js'
      - 'api/_check_observations.js'
      - 'api/_change_intelligence.js'
      - 'api/_readiness_intelligence.js'
      - 'api/_portfolio_intelligence.js'
      - 'api/_insight_refresh.js'
      - 'api/_operator_digest.js'
      - 'api/_learning_memory.js'
      - 'api/_lib.js'
      - 'api/audit-refresh.js'
      - 'api/intelligence-refresh.js'
      - 'api/intelligence-learning.js'
      - 'api/bi-events.js'
      - 'api/contact.js'
      - 'api/scan-live.js'
      - 'api/recommendations.js'
      - 'api/weekly-brief.js'
      - 'api/intelligence-portfolio.js'
      - 'intelligence/**'
      - 'middleware.js'
      - 'vercel.json'
      - 'bi/**'
      - 'package.json'
      - '.github/workflows/bi-quality.yml'
  workflow_dispatch:

jobs:
  bi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bi:check
