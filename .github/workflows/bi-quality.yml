name: BI quality

on:
  push:
    branches: [main, feature/bi-learning-loop-v2]
    paths:
      - 'api/_intelligence.js'
      - 'api/_bi_patterns.js'
      - 'api/_bi_feed.js'
      - 'api/bi-events.js'
      - 'api/recommendations.js'
      - 'api/weekly-brief.js'
      - 'intelligence/**'
      - 'bi/**'
      - 'package.json'
      - '.github/workflows/bi-quality.yml'
  pull_request:
    paths:
      - 'api/_intelligence.js'
      - 'api/_bi_patterns.js'
      - 'api/_bi_feed.js'
      - 'api/bi-events.js'
      - 'api/recommendations.js'
      - 'api/weekly-brief.js'
      - 'intelligence/**'
      - 'bi/**'
      - 'package.json'
      - '.github/workflows/bi-quality.yml'
  workflow_dispatch:

jobs:
  bi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bi:check
