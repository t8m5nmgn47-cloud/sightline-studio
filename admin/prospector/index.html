<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prospector — Sightline</title><meta name="robots" content="noindex">
<style>
  :root{--bg:#0e1116;--panel:#161b22;--panel2:#1c222b;--line:#262d38;--ink:#eef1f5;--mut:#95a0af;--gold:#c6a24a;
    --dead:#d1594f;--hot:#e0763a;--warm:#e0b93a;--mild:#4f9bd1;--served:#5b6472;--good:#43c47d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 22px 80px}
  a.back{color:var(--mut);text-decoration:none;font-size:.82rem}
  h1{font-size:1.5rem;margin:.4em 0 .2em}.sub{color:var(--mut);max-width:74ch;font-size:.92rem}
  /* KPI band */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .kpi b{font-size:1.9rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;line-height:1}
  .kpi span{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;display:block}
  .kpi.hero b{color:var(--good)}
  /* controls */
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .bar .grp{display:flex;gap:6px;flex-wrap:wrap}
  .bar button{font:inherit;font-size:.8rem;padding:7px 12px;border-radius:100px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .bar button.on{border-color:var(--gold);color:#fff}
  .bar .lbl{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
  .bar .sp{margin-left:auto}
  /* lead rows */
  .lead{display:grid;grid-template-columns:64px 1fr 150px auto;gap:14px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:7px;border-left:4px solid var(--line)}
  .lead.DEAD{border-left-color:var(--dead)}.lead.HOT{border-left-color:var(--hot)}.lead.WARM{border-left-color:var(--warm)}.lead.MILD{border-left-color:var(--mild)}.lead.SERVED{border-left-color:var(--served)}
  .sc{text-align:center}.sc b{font-size:1.6rem;font-variant-numeric:tabular-nums;display:block;line-height:1}.sc span{font-size:.62rem;color:var(--mut)}
  .lead h3{font-size:1.02rem;margin:0}.lead h3 a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--mut)}
  .meta{font-size:.74rem;color:var(--mut);margin-top:2px}
  .pitch{font-size:.85rem;margin-top:5px;opacity:.92}
  .val{text-align:right;font-variant-numeric:tabular-nums}
  .val .mo{font-size:1.15rem;font-weight:700}.val .mo small{font-size:.7rem;color:var(--mut);font-weight:500}
  .val .yr{font-size:.76rem;color:var(--mut)}.val .exp{font-size:.72rem;color:var(--good);margin-top:2px}
  .tierbadge{font-size:.66rem;font-weight:800;letter-spacing:.05em;padding:5px 9px;border-radius:6px;white-space:nowrap;text-align:center}
  .tierbadge.DEAD{background:rgba(209,89,79,.18);color:var(--dead)}.tierbadge.HOT{background:rgba(224,118,58,.18);color:var(--hot)}
  .tierbadge.WARM{background:rgba(224,185,58,.16);color:var(--warm)}.tierbadge.MILD{background:rgba(79,155,209,.16);color:var(--mild)}.tierbadge.SERVED{background:rgba(91,100,114,.2);color:var(--served)}
  .chip{font-size:.62rem;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
  @media(max-width:720px){.lead{grid-template-columns:52px 1fr;gap:8px}.val,.tierbadge{grid-column:2}}
  /* cold-call brief */
  .leadwrap{margin-bottom:7px}.leadwrap .lead{margin-bottom:0;border-radius:12px 12px 0 0;border-bottom:none}
  details.brief{background:var(--panel2);border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;font-size:.85rem}
  details.brief[open]{padding-bottom:14px}
  details.brief summary{cursor:pointer;padding:9px 16px;color:var(--gold);font-weight:600;font-size:.78rem;list-style:none;user-select:none}
  details.brief summary::-webkit-details-marker{display:none}
  details.brief summary::before{content:"📞 ";}
  .brief-in{padding:2px 16px 0;display:grid;gap:12px}
  .bench{display:flex;align-items:center;gap:12px}
  .benchbar{flex:1;height:10px;border-radius:100px;background:#20262e;position:relative;overflow:visible}
  .benchbar .you{height:100%;border-radius:100px}.benchbar .avg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--mut)}.benchbar .best{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--good)}
  .benchtxt{font-size:.76rem;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
  .cg{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
  .cg li{display:flex;gap:8px;align-items:baseline}.cg .pct{color:var(--warm);font-weight:700;font-variant-numeric:tabular-nums;font-size:.78rem;white-space:nowrap}
  .cg .why{color:var(--mut);font-size:.78rem}
  .opener{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:8px;padding:11px 13px;font-style:italic;line-height:1.5}
  .opener b{font-style:normal;display:block;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--good);margin-bottom:5px}
  .copybtn{margin-top:8px;font:inherit;font-size:.76rem;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
  .lbl2{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:3px}
  /* built-goods chips on each row */
  .goods{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .goods a{font-size:.72rem;font-weight:600;text-decoration:none;padding:4px 10px;border-radius:100px;border:1px solid var(--line);color:var(--ink);background:var(--panel2)}
  .goods a.site{border-color:var(--good);color:var(--good)}
  .goods a.build{border-color:var(--gold);color:var(--gold)}
  .goods a:hover{filter:brightness(1.2)}
  /* the send package */
  .send{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:11px 13px}
  .send b.h{display:block;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
  .send .subj{font-weight:700;font-size:.86rem;margin-bottom:7px}
  .send pre{margin:0;white-space:pre-wrap;font:inherit;font-size:.82rem;color:var(--ink);opacity:.9;max-height:260px;overflow:auto}
</style></head>
<body><div class="wrap">
  <a class="back" href="../">← Admin</a>
  <h1>Prospector</h1>
  <p class="sub">Churches &amp; businesses that <b>paid for a site but never finished it</b> — scored on readiness (tradition/vertical-aware), ranked by opportunity, each with a projected <b>sales goal</b>. Point it at any platform's customer list to refill the pipeline.</p>
  <div class="kpis" id="kpis"></div>
  <div class="bar" id="bar"></div>
  <div id="list"></div>
</div>
<script type="module">
const data = await (await fetch('/engine/preview/prospects.json')).json();
const $=id=>document.getElementById(id);
const money=n=> n>=1000? '$'+(n/1000).toFixed(n>=10000?0:1)+'k' : '$'+Math.round(n);
const tiers=['DEAD','HOT','WARM','MILD','SERVED'], labels={DEAD:'Dead site',HOT:'Hot',WARM:'Warm',MILD:'Mild',SERVED:'Served'};
// KPIs
const leads=data.filter(d=>['DEAD','HOT','WARM'].includes(d.tier));
const pipeline=leads.reduce((s,d)=>s+d.expected,0), tam=data.reduce((s,d)=>s+d.annual,0);
$('kpis').innerHTML=`
  <div class="kpi hero"><b>${money(pipeline)}</b><span>Weighted pipeline (leads)</span></div>
  <div class="kpi"><b>${money(tam)}</b><span>Annual TAM (all)</span></div>
  <div class="kpi"><b>${leads.length}</b><span>Qualified leads</span></div>
  <div class="kpi"><b style="color:var(--dead)">${data.filter(d=>d.tier==='DEAD').length}</b><span>Dead sites</span></div>
  <div class="kpi"><b>${data.filter(d=>d.assets&&(d.assets.demo||d.assets.funnel)).length}</b><span>Demos ready to send</span></div>
  <div class="kpi"><b>${data.length}</b><span>Total scored</span></div>`;
// controls
let seg='leads', typ='all', sort='opp';
$('bar').innerHTML=`
  <span class="lbl">Show</span><div class="grp" data-k="seg">
    ${[['leads','Leads'],['DEAD','Dead'],['HOT','Hot'],['WARM','Warm'],['MILD','Mild'],['SERVED','Served'],['all','All']].map(([k,l])=>`<button data-v="${k}" class="${k===seg?'on':''}">${l}</button>`).join('')}</div>
  <span class="lbl sp">Type</span><div class="grp" data-k="typ">
    ${[['all','All'],['church','⛪ Church'],['business','🏢 Business']].map(([k,l])=>`<button data-v="${k}" class="${k===typ?'on':''}">${l}</button>`).join('')}</div>
  <span class="lbl">Sort</span><div class="grp" data-k="sort">
    ${[['opp','Opportunity'],['value','Value'],['score','Score']].map(([k,l])=>`<button data-v="${k}" class="${k===sort?'on':''}">${l}</button>`).join('')}</div>`;
$('bar').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.parentNode.dataset.k;
  if(k==='seg')seg=b.dataset.v; if(k==='typ')typ=b.dataset.v; if(k==='sort')sort=b.dataset.v;
  b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===({seg,typ,sort})[k]));render();};
const order={DEAD:0,HOT:1,WARM:2,MILD:3,SERVED:4};
function render(){
  let rows=data.filter(d=>seg==='all'?true:seg==='leads'?['DEAD','HOT','WARM'].includes(d.tier):d.tier===seg)
                 .filter(d=>typ==='all'?true:d.type===typ);
  rows.sort((a,b)=> sort==='value'? b.expected-a.expected : sort==='score'? a.score-b.score : (order[a.tier]-order[b.tier])||(a.score-b.score));
  $('list').innerHTML = rows.map((d,i)=>{
    const bm=d.benchmark||{}, pct=v=>Math.max(2,Math.min(100,v));
    const a=d.assets||{};
    const goods = `
      <div class="goods">
        ${a.demo?`<a class="site" href="${a.demo}" target="_blank" rel="noopener">▶ Their new site</a>`:`<a class="build" href="../intake/">✚ No demo yet — build it (10 min)</a>`}
        ${a.funnel?`<a href="${a.funnel}" target="_blank" rel="noopener">Funnel</a>`:''}
        ${a.teardown?`<a href="${a.teardown}" target="_blank" rel="noopener">Teardown</a>`:''}
      </div>`;
    const brief = `
      <details class="brief"><summary>Call &amp; send brief</summary><div class="brief-in">
        <div><div class="lbl2">vs ${bm.catLabel||'category'} (${bm.catN||0} scored)</div>
          <div class="bench"><div class="benchbar"><div class="you" style="width:${pct(d.score)}%;background:${d.score>=(bm.avg||60)?'var(--good)':'var(--warm)'}"></div><div class="avg" style="left:${pct(bm.avg||60)}%"></div><div class="best" style="left:${pct(bm.max||100)}%"></div></div>
          <span class="benchtxt">you ${d.score} · avg ${bm.avg||'–'} · best ${bm.max||'–'}</span></div></div>
        ${(d.competitorGaps&&d.competitorGaps.length)?`<div><div class="lbl2">Competitors do this — they don't</div><ul class="cg">${d.competitorGaps.map(g=>`<li><span class="pct">${g.peerPct}%</span> <span><b>${g.label}</b> — <span class="why">${g.why}</span></span></li>`).join('')}</ul></div>`:''}
        <div class="opener"><b>Cold-call opener</b>${d.opener||''}<br><button class="copybtn" data-i="${i}">Copy opener</button></div>
        ${d.email?`<div class="send"><b class="h">✉️ What we send — ready to go</b>
          ${d.contact?`<div class="subj" style="color:var(--good)">To: ${d.contact.person||''}${d.contact.email?' <'+d.contact.email+'>':''}${d.contact.phone?' · '+d.contact.phone:''}</div>`:''}
          <div class="subj">Subject: ${d.email.subject}</div>
          <pre>${d.email.body.replace(/</g,'&lt;')}</pre>
          <button class="copybtn mail" data-i="${i}">Copy email</button>
          <button class="copybtn mailto" data-i="${i}">Open in Mail</button></div>`
        :`<div class="send"><b class="h">✉️ What we send</b><div style="font-size:.82rem;color:var(--mut)">No demo built yet — the email writes itself the moment one exists. <a href="../intake/" style="color:var(--gold)">Build it first →</a></div></div>`}
      </div></details>`;
    return `<div class="leadwrap">
      <div class="lead ${d.tier}">
        <div class="sc"><b style="color:${d.dead?'var(--dead)':'inherit'}">${d.dead?'✕':d.score}</b><span>${d.dead?'dead':'/100'}</span></div>
        <div>
          <h3><a href="https://${d.domain}" target="_blank" rel="noopener">${d.name}</a> <span class="chip">${d.tradition}${d.platform!=='—'?' · '+d.platform:''}</span></h3>
          <div class="meta">${d.domain}${d.audit?` · <span style="color:${d.audit.scary?'var(--dead)':d.audit.score<60?'var(--warm)':'var(--mut)'}">🛡 ${d.audit.score}/100${d.audit.scary?' ⚠':''}</span>`:''}${d.breach&&d.breach.count>0?` · <span style="color:var(--dead)" title="${(d.breach.exposures||[]).map(e=>e.title+(e.year?' ('+e.year+')':'')).join(', ')}">🔓 ${d.breach.count} breach${d.breach.count>1?'es':''}${d.breach.hasPasswords?' ⚠':''}</span>`:''}${d.reviews?` · <span style="color:${d.reviews.weak?'var(--warm)':'var(--mut)'}">★ ${d.reviews.rating??'—'} · ${d.reviews.count} reviews${d.reviews.peerMedianCount?` (peers: ${d.reviews.peerMedianCount})`:''}</span>`:''}${d.phone?` · ${d.phone}`:''}</div>
          <div class="pitch">${d.pitch}</div>
          ${goods}
        </div>
        <div class="val"><div class="mo">$${d.mrr}<small>/mo</small></div><div class="yr">$${d.annual.toLocaleString()}/yr</div><div class="exp">${d.winPct}% → $${d.expected.toLocaleString()} exp.</div></div>
        <div class="tierbadge ${d.tier}">${labels[d.tier]}</div>
      </div>${brief}</div>`;
  }).join('') || '<p style="color:var(--mut)">None in this view.</p>';
  document.querySelectorAll('.copybtn').forEach(b=>b.onclick=e=>{e.preventDefault();const d=rows[+b.dataset.i];
    if(b.classList.contains('mailto')){ if(d.email) location.href='mailto:?subject='+encodeURIComponent(d.email.subject)+'&body='+encodeURIComponent(d.email.body); return; }
    const txt=b.classList.contains('mail') ? (d.email?('Subject: '+d.email.subject+'\n\n'+d.email.body):'') : d.opener;
    const orig=b.textContent;
    navigator.clipboard&&navigator.clipboard.writeText(txt);b.textContent='Copied ✓';setTimeout(()=>b.textContent=orig,1500);});
}
render();
</script>
</body></html>
